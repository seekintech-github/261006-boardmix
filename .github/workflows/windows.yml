name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 installer and ZIP
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build Windows portable and ZIP
        run: npm run dist:win -- --publish never

      - name: Build Windows installer
        run: npm run dist:win:installer -- --publish never

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: ZhiTu-Windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
